<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ea580c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c2410c;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="80" fill="url(#bgGradient)"/>
  
  <!-- Chip Body -->
  <rect x="96" y="96" width="320" height="320" rx="32" stroke="white" stroke-width="24" opacity="0.9" fill="white" fill-opacity="0.1"/>
  
  <!-- Pins - Left -->
  <path d="M96 176H48" stroke="white" stroke-width="20" stroke-linecap="round"/>
  <path d="M96 256H48" stroke="white" stroke-width="20" stroke-linecap="round"/>
  <path d="M96 336H48" stroke="white" stroke-width="20" stroke-linecap="round"/>
  
  <!-- Pins - Right -->
  <path d="M416 176H464" stroke="white" stroke-width="20" stroke-linecap="round"/>
  <path d="M416 256H464" stroke="white" stroke-width="20" stroke-linecap="round"/>
  <path d="M416 336H464" stroke="white" stroke-width="20" stroke-linecap="round"/>
  
  <!-- Pins - Top -->
  <path d="M176 96V48" stroke="white" stroke-width="20" stroke-linecap="round"/>
  <path d="M256 96V48" stroke="white" stroke-width="20" stroke-linecap="round"/>
  <path d="M336 96V48" stroke="white" stroke-width="20" stroke-linecap="round"/>
  
  <!-- Pins - Bottom -->
  <path d="M176 416V464" stroke="white" stroke-width="20" stroke-linecap="round"/>
  <path d="M256 416V464" stroke="white" stroke-width="20" stroke-linecap="round"/>
  <path d="M336 416V464" stroke="white" stroke-width="20" stroke-linecap="round"/>

  <!-- Internal Pulse Signal -->
  <path d="M160 256H208L232 192L280 320L304 256H352" stroke="white" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
</svg>
